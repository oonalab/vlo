name: Release

# Every push to main keeps a "Release PR" up to date: the next version and the changelog
# entry, both derived from Conventional Commit messages since the last release. Merging
# that PR tags the release, and the rest of this workflow publishes it to npm.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never cancel a release that is part-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Reads release-please-config.json and .release-please-manifest.json.
      - name: Open or update the Release PR
        id: release
        uses: googleapis/release-please-action@v4

  # A tag made with the default token does not start other workflows, so the gates are
  # called from here rather than left to the push run of ci.yml.
  gates:
    name: Gates
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [release-please, gates]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry accepts this workflow's OIDC identity, so there
      # is no npm token to store. Configured under the package's settings on npmjs.com.
      id-token: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package version matches the release
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./sdk/ts/sdk/package.json').version")"
          if [ "v$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "package.json says $PACKAGE_VERSION but the release tag is $TAG_NAME" >&2
            exit 1
          fi

      - name: Build SDK
        run: pnpm --filter @oona/vlo build

      - name: Pack, install and run the tarball
        run: ./scripts/smoke-package.sh

      # `prepack` copies LICENSE and NOTICE in from the repo root.
      - name: Publish
        working-directory: sdk/ts/sdk
        run: |
          npm --version
          npm publish --access public --provenance
