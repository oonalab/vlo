[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/oona/orbi"
homepage = "https://github.com/oona/orbi/tree/main/packages/vlo"
keywords = ["workflow", "durable-execution", "event-sourcing", "wasm", "state-machine"]
categories = ["asynchronous", "wasm"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
schemars = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
proptest = "1"

# Small, fast wasm: the kernel must stay under 1 MiB (see `docs/limits.md`).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
